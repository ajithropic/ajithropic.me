        color: var(--site-text);
      }

        width: 2rem;
        height: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        color: var(--site-text);

        font-size: 0.84rem;
        line-height: 1;

        background: var(--site-text);
        color: var(--site-panel);
      }

      html.dark .theme-toggle {
        color: #ffffff;
      }

    <style>
      .travel-shell {
        overflow: hidden;
        background: var(--site-panel);
        border: 1px solid var(--site-border);
        box-shadow: 6px 6px 0 var(--site-shadow);
      }

      .travel-stage-wrap {
        position: relative;
      }

      .travel-stage {
        position: relative;
        min-height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem;
        background:
          repeating-linear-gradient(
            0deg,
            color-mix(in srgb, var(--site-text) 7%, transparent) 0,
            color-mix(in srgb, var(--site-text) 7%, transparent) 1px,
            transparent 1px,
            transparent 18px
          ),
          repeating-linear-gradient(
            90deg,
            color-mix(in srgb, var(--site-text) 7%, transparent) 0,
            color-mix(in srgb, var(--site-text) 7%, transparent) 1px,
            transparent 1px,
            transparent 18px
          ),
          var(--site-panel);
        cursor: grab;
        touch-action: none;
      }

      .travel-stage:active {
        cursor: grabbing;
      }

      .globe-canvas {
        width: min(72vw, 560px);
        max-width: 100%;
        aspect-ratio: 1;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.12));
      }

      .travel-hud {
        position: absolute;
        top: 1rem;
        left: 1rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        line-height: 1.5;
        padding: 0.55rem 0.7rem;
        background: color-mix(in srgb, var(--site-panel) 94%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
      }

      .travel-legend {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        padding: 0.7rem 0.8rem;
        background: color-mix(in srgb, var(--site-panel) 94%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
      }

      .travel-tooltip {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 14px));
        padding: 0.4rem 0.55rem;
        background: color-mix(in srgb, var(--site-panel) 96%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 3px 3px 0 var(--site-shadow);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        line-height: 1.2;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .travel-tooltip.is-visible {
        opacity: 1;
      }

      .travel-legend-row {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .travel-marker-card {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        width: min(280px, calc(100% - 2rem));
        display: none;
        flex-direction: column;
        gap: 0.55rem;
        padding: 0.8rem;
        background: color-mix(in srgb, var(--site-panel) 96%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
      }

      .travel-marker-card.is-open {
        display: flex;
      }

      .travel-marker-card-head {
        display: flex;
        justify-content: space-between;
        gap: 0.8rem;
        align-items: start;
      }

      .travel-marker-card-head p,
      .travel-marker-card-copy p {
        margin: 0;
      }

      .travel-marker-card-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--site-muted);
      }

      .travel-marker-card-title {
        margin-top: 0.2rem;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .travel-marker-card-close {
        width: 1.85rem;
        height: 1.85rem;
        border: 1px solid var(--site-border-strong);
        background: var(--site-panel);
        box-shadow: 2px 2px 0 var(--site-shadow);
        font-size: 0.92rem;
        line-height: 1;
      }

      .travel-marker-card-close:hover {
        background: var(--site-text);
        color: var(--site-panel);
      }

      .travel-marker-card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border: 1px solid var(--site-border);
        margin: 0;
      }

      .travel-marker-card-copy {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.84rem;
        line-height: 1.45;
        color: var(--site-muted);
      }

      .legend-check {
        width: 14px;
        height: 14px;
        background: #1ca34b;
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 10px;
        line-height: 1;
        font-weight: 700;
      }

      .legend-pin {
        position: relative;
        width: 12px;
        height: 12px;
        background: #d7263d;
        border-radius: 999px;
        display: inline-block;
      }

      .legend-pin::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 10px;
        width: 2px;
        height: 10px;
        margin-left: -1px;
        background: #7c1320;
      }

      @media (max-width: 900px) {
        .travel-stage {
          min-height: 320px;
          padding: 0.5rem;
        }

        .globe-canvas {
          width: min(82vw, 420px);
        }
      }

      @media (max-width: 640px) {
        .travel-stage {
          min-height: 250px;
          padding: 0.35rem;
        }

        .globe-canvas {
          width: min(78vw, 320px);
        }

        .travel-hud {
          display: none;
        }

        .travel-legend {
          left: 0.55rem;
          bottom: 0.55rem;
          padding: 0.45rem 0.55rem;
          gap: 0.3rem;
          font-size: 0.64rem;
        }

        .travel-marker-card {
          position: static;
          width: auto;
          margin: 0.75rem;
          box-shadow: 4px 4px 0 var(--site-shadow);
        }

        .travel-marker-card img {
          height: 132px;
        }
      }
    </style>

          { name: "Berlin", coords: [13.405, 52.52], kind: "wishlist" },
          { name: "Italy", coords: [12.5, 42.8], kind: "wishlist" },
          { name: "Los Angeles", coords: [-118.2437, 34.0522],kind: "wishlist",},
          { name: "Shanghai", coords: [121.4737, 31.2304], kind: "wishlist" },
          { name: "Beijing", coords: [116.4074, 39.9042], kind: "wishlist" },
          { name: "New Zealand", coords: [172.0, -41.0], kind: "wishlist" },
          { name: "Sweden", coords: [15.0, 62.0], kind: "wishlist" },
          { name: "Thailand", coords: [100.9925, 15.87], kind: "wishlist" },
          { name: "Toronto", coords: [-79.3832, 43.6532], kind: "wishlist" },
          { name: "Sydney", coords: [151.2093, -33.8688], kind: "wishlist" },
          { name: "Melbourne", coords: [144.9631, -37.8136], kind: "wishlist" },
          { name: "Perth", coords: [115.8575, -31.9505], kind: "wishlist" },
          { name: "Switzerland", coords: [8.2275, 46.8182], kind: "wishlist" },
          { name: "Norway", coords: [8.4689, 60.472], kind: "wishlist" },
          { name: "Finland", coords: [25.7482, 61.9241], kind: "wishlist" },
          { name: "Iceland", coords: [-19.0208, 64.9631], kind: "wishlist" },
          { name: "Portugal", coords: [-8.2245, 39.3999], kind: "wishlist" },
          { name: "Spain", coords: [-3.7492, 40.4637], kind: "wishlist" },
          { name: "France", coords: [2.2137, 46.2276], kind: "wishlist" },
          { name: "Greece", coords: [21.8243, 39.0742], kind: "wishlist" },
        ];

        const projection = d3
          .geoOrthographic()
          .translate([canvas.width / 2, canvas.height / 2])
          .scale(canvas.width * 0.41)
          .clipAngle(90)
          .precision(0.3)
          .rotate([98, -39]);

        const path = d3.geoPath(projection, ctx);
        const graticule = d3.geoGraticule10();
        const sphere = { type: "Sphere" };
        const markers = [...wishlist, ...visited];
        const pointerMap = new Map();
        const baseScale = canvas.width * 0.41;
        const minScale = canvas.width * 0.28;
        const maxScale = canvas.width * 0.68;

        let countries = null;
        let isDragging = false;
        let dragStart = null;
        let rotationStart = projection.rotate().slice();
        let autoSpin = true;
        let autoSpinTimer = null;
        let hoveredMarker = null;
        let hoveredPoint = null;
        let pinchStartDistance = null;
        let pinchStartScale = projection.scale();
        let selectedMarker = null;

        function openMarkerCard(marker) {
          const details = markerDetails[marker.name];
          markerCardKind.textContent =
            marker.kind === "visited" ? "been there" : "bucket list";
          markerCardTitle.textContent = marker.name;
          if (details) {
            markerCardImage.src = details.image;
            markerCardImage.alt = marker.name;
            markerCardImage.style.display = "";
            markerCardCaption.textContent = details.caption;
          } else {
            markerCardImage.style.display = "none";
            markerCardCaption.textContent =
              marker.kind === "visited"
                ? "i've been here, but i haven't added a photo to the travel strip yet."
                : "still on the list. photo comes after the plane ticket.";
          }
          markerCard.classList.add("is-open");
          selectedMarker = marker;
        }

        function closeMarkerCard() {
          markerCard.classList.remove("is-open");
          selectedMarker = null;
        }

        function setTooltip(marker, point) {
          if (!marker || !point) {
            tooltip.classList.remove("is-visible");
            hoveredMarker = null;
            hoveredPoint = null;
            return;
          }

          hoveredMarker = marker;
          hoveredPoint = point;
          tooltip.textContent = marker.name;
          tooltip.style.left = `${point[0]}px`;
          tooltip.style.top = `${point[1]}px`;
          tooltip.classList.add("is-visible");
        }

        function clampScale(nextScale) {
          return Math.max(minScale, Math.min(maxScale, nextScale));
        }

        function scheduleAutoSpin() {
          if (autoSpinTimer) {
            clearTimeout(autoSpinTimer);
          }

          autoSpinTimer = setTimeout(() => {
            if (!isDragging && pointerMap.size === 0) {
              autoSpin = true;
            }
          }, 5000);
        }

        function markInteraction() {
          autoSpin = false;
          scheduleAutoSpin();
        }

        function distanceBetweenPointers() {
          const points = [...pointerMap.values()];
          if (points.length < 2) {
            return null;
          }

          const dx = points[0].x - points[1].x;
          const dy = points[0].y - points[1].y;
          return Math.hypot(dx, dy);
        }

        function zoomBy(factor) {
          projection.scale(clampScale(projection.scale() * factor));
          draw();
        }

        function getVisiblePoint(marker) {
          const point = projection(marker.coords);
          if (!point) {
            return null;
          }

          const center = projection.invert(point);
          if (!center) {
            return null;
          }

          const visible = d3.geoDistance(center, marker.coords) < Math.PI / 2;
          return visible ? point : null;
        }

        function findMarkerAtPoint(x, y) {
          for (const marker of markers) {
            const point = getVisiblePoint(marker);
            if (!point) {
              continue;
            }

            const hitRadius = marker.kind === "visited" ? 10 : 12;
            if (Math.hypot(point[0] - x, point[1] - y) <= hitRadius) {
              return { marker, point };
            }
          }

          return null;
        }

        function drawPixelCheck(x, y, alpha = 1) {
          ctx.save();
          ctx.translate(Math.round(x), Math.round(y));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#1ca34b";
          ctx.fillRect(-7, -7, 14, 14);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(-4, 0, 2, 2);
          ctx.fillRect(-2, 2, 2, 2);
          ctx.fillRect(0, 0, 2, 2);
          ctx.fillRect(2, -2, 2, 2);
          ctx.fillRect(4, -4, 2, 2);
          ctx.restore();
        }

        function drawPushPin(x, y, alpha = 1) {
          ctx.save();
          ctx.translate(Math.round(x), Math.round(y));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#d7263d";
          ctx.beginPath();
          ctx.arc(0, -4, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#7c1320";
          ctx.fillRect(-1, 2, 2, 10);
          ctx.restore();
        }

        function drawMarker(marker) {
          const point = projection(marker.coords);
          if (!point) {
            return;
          }

          const center = projection.invert(point);
          if (!center) {
            return;
          }

          const visible = d3.geoDistance(center, marker.coords) < Math.PI / 2;
          const alpha = visible ? 1 : 0.22;

          if (marker.kind === "visited") {
            drawPixelCheck(point[0], point[1], alpha);
          } else {
            drawPushPin(point[0], point[1] - 2, alpha);
          }
        }

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          ctx.save();
          path(sphere);
          ctx.clip();

          ctx.fillStyle = "rgba(0, 0, 0, 0.025)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          if (countries) {
            ctx.beginPath();
            path(countries);
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.16)";
            ctx.stroke();
          }

          ctx.beginPath();
          path(graticule);
          ctx.lineWidth = 0.55;
          ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
          ctx.stroke();

          markers.forEach(drawMarker);
          ctx.restore();

          ctx.beginPath();
          path(sphere);
          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
          ctx.stroke();

          if (hoveredMarker) {
            const point = getVisiblePoint(hoveredMarker);
            if (point) {
              setTooltip(hoveredMarker, point);
            } else {
              setTooltip(null, null);
            }
          }

          if (selectedMarker) {
            const point = projection(selectedMarker.coords);
            if (!point) {
              closeMarkerCard();
            }
          }
        }

        function animate() {
          if (autoSpin && !isDragging) {
            const [lambda, phi, gamma] = projection.rotate();
            projection.rotate([lambda - 0.07, phi, gamma]);
          }

          draw();
          requestAnimationFrame(animate);
        }

        canvas.addEventListener("pointerdown", (event) => {
          pointerMap.set(event.pointerId, {
            x: event.offsetX,
            y: event.offsetY,
          });
          isDragging = true;
          markInteraction();
          dragStart = [event.clientX, event.clientY];
          rotationStart = projection.rotate().slice();
          canvas.setPointerCapture(event.pointerId);

          if (pointerMap.size === 2) {
            pinchStartDistance = distanceBetweenPointers();
            pinchStartScale = projection.scale();
            isDragging = false;
            dragStart = null;
          }
        });

        canvas.addEventListener("pointermove", (event) => {
          pointerMap.set(event.pointerId, {
            x: event.offsetX,
            y: event.offsetY,
          });

          if (pointerMap.size >= 2) {
            markInteraction();
            const currentDistance = distanceBetweenPointers();
            if (pinchStartDistance && currentDistance) {
              projection.scale(
                clampScale(
                  pinchStartScale * (currentDistance / pinchStartDistance),
                ),
              );
              draw();
            }
            return;
          }

          if (isDragging && dragStart) {
            markInteraction();
            const dx = event.clientX - dragStart[0];
            const dy = event.clientY - dragStart[1];
            projection.rotate([
              rotationStart[0] + dx * 0.35,
              Math.max(-65, Math.min(65, rotationStart[1] - dy * 0.35)),
              rotationStart[2],
            ]);
            draw();
            return;
          }

          const hit = findMarkerAtPoint(event.offsetX, event.offsetY);
          if (hit) {
            setTooltip(hit.marker, hit.point);
          } else {
            setTooltip(null, null);
          }
        });

        function stopDragging(event) {
          pointerMap.delete(event.pointerId);
          isDragging = false;
          dragStart = null;
          if (pointerMap.size < 2) {
            pinchStartDistance = null;
            pinchStartScale = projection.scale();
          }
          scheduleAutoSpin();
        }

        canvas.addEventListener("wheel", (event) => {
          event.preventDefault();
          markInteraction();
          zoomBy(event.deltaY > 0 ? 0.94 : 1.06);
        });

        canvas.addEventListener("pointerup", stopDragging);
        canvas.addEventListener("pointercancel", stopDragging);
        canvas.addEventListener("pointerleave", (event) => {
          if (!isDragging) {
            setTooltip(null, null);
          }
          stopDragging(event);
        });

        canvas.addEventListener("click", (event) => {
          const hit = findMarkerAtPoint(event.offsetX, event.offsetY);
          if (hit) {
            openMarkerCard(hit.marker);
          } else {
            closeMarkerCard();
          }
        });

        markerCardClose.addEventListener("click", () => {
          closeMarkerCard();
        });

        fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
          .then((response) => response.json())
          .then((world) => {
            countries = topojson.feature(world, world.objects.countries);
            draw();
          })
          .catch(() => {
            draw();
          });

        animate();
      })();
    </script>
    <script>
      (() => {
        const toggle = document.getElementById("theme-toggle");
        const icon = document.getElementById("theme-toggle-icon");
        const root = document.documentElement;

        function syncThemeIcon() {
          if (icon) {
            icon.classList.toggle("is-sun", root.classList.contains("dark"));
          }
        }

        if (toggle) {
          syncThemeIcon();
          toggle.addEventListener("click", () => {
            root.classList.toggle("dark");
            localStorage.setItem(
              "theme",
              root.classList.contains("dark") ? "dark" : "light",
            );
            syncThemeIcon();
          });
        }
      })();
    </script>
