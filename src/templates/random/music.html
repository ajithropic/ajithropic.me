        --site-border: rgba(0, 0, 0, 0.24);
        --site-border-strong: rgba(0, 0, 0, 0.9);
        --site-panel: #ffffff;
        --site-panel-soft: #f1efe7;
        --site-shadow: rgba(0, 0, 0, 0.12);
        --site-shadow-strong: rgba(0, 0, 0, 0.5);
        --site-link: #0f62fe;
      }

      html.dark {
        color-scheme: dark;
        --site-bg: #0d1016;
        --site-text: #f5f7fb;
        --site-muted: rgba(245, 247, 251, 0.72);
        --site-border: rgba(255, 255, 255, 0.16);
        --site-border-strong: rgba(255, 255, 255, 0.9);
        --site-panel: #131823;
        --site-panel-soft: #0f141d;
        --site-shadow: rgba(0, 0, 0, 0.38);
        --site-shadow-strong: rgba(255, 255, 255, 0.3);
        --site-link: #8bb7ff;
      }

      body {
        background: var(--site-bg);
        color: var(--site-text);
      }

      .theme-toggle {
        width: 2rem;
        height: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--site-border-strong);
        background: var(--site-panel);
        color: var(--site-text);
        box-shadow: 3px 3px 0 var(--site-shadow-strong);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.84rem;
        line-height: 1;
      }

      .theme-toggle:hover {
        background: var(--site-text);
        color: var(--site-panel);
      }

      html.dark .theme-toggle {
        color: #ffffff;
      }

      .theme-toggle-glyph {

        height: 1rem;

    <style>
      .music-shell {
        overflow: hidden;
        background: var(--site-panel);
        border: 1px solid var(--site-border);
        box-shadow: 6px 6px 0 var(--site-shadow);
      }

      .music-stage-wrap {
        position: relative;
      }

      .music-stage {
        position: relative;
        aspect-ratio: 16 / 9;
        min-height: 320px;
        overflow: hidden;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.06),
            rgba(255, 255, 255, 0)
          ),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.05) 0,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px,
            transparent 18px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.05) 0,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px,
            transparent 18px
          ),
          #050505;
        cursor: pointer;
      }

      .music-stage.is-paused {
        cursor: default;
      }

      .music-pause-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.22);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease;
        z-index: 8;
      }

      .music-stage.is-paused .music-pause-overlay {
        opacity: 1;
        pointer-events: auto;
      }

      .music-pause-button {
        border: 1px solid rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.94);
        color: #111111;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.18);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.9rem;
        padding: 0.85rem 1.15rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      .music-hud {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 10;
        padding: 0.6rem 0.75rem;
        background: color-mix(in srgb, var(--site-panel) 92%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.75rem;
        line-height: 1.45;
      }

      .music-speed {
        margin-top: 0.45rem;
      }

      .music-speed input {
        width: 100%;
        accent-color: #111111;
      }

      .music-hover {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        z-index: 10;
        min-width: 220px;
        max-width: min(340px, calc(100% - 2rem));
        padding: 0.7rem 0.8rem;
        background: color-mix(in srgb, var(--site-panel) 94%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
        font-family: "IBM Plex Mono", monospace;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .music-hover p {
        margin: 0;
      }

      .music-hover-art {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        border: 1px solid var(--site-border);
        object-fit: cover;
        background: #111111;
      }

      .music-hover-copy {
        min-width: 0;
      }

      .music-hover .music-hover-label {
        font-size: 0.72rem;
        opacity: 0.6;
        margin-bottom: 0.28rem;
      }

      .music-hover .music-hover-title {
        font-size: 0.95rem;
        line-height: 1.25;
        font-weight: 600;
      }

      .music-hover .music-hover-artist {
        margin-top: 0.22rem;
        font-size: 0.82rem;
        opacity: 0.75;
      }

      .music-detail {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 10;
        width: min(300px, calc(100% - 2rem));
        display: none;
        flex-direction: column;
        gap: 0.7rem;
        padding: 0.8rem;
        background: color-mix(in srgb, var(--site-panel) 95%, transparent);
        border: 1px solid var(--site-border);
        box-shadow: 4px 4px 0 var(--site-shadow);
      }

      .music-detail.is-open {
        display: flex;
      }

      .music-detail-head {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: start;
      }

      .music-detail-head p,
      .music-detail-copy p {
        margin: 0;
      }

      .music-detail-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--site-muted);
      }

      .music-detail-title {
        margin-top: 0.2rem;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .music-detail-close {
        width: 1.85rem;
        height: 1.85rem;
        border: 1px solid var(--site-border-strong);
        background: var(--site-panel);
        box-shadow: 2px 2px 0 var(--site-shadow);
        font-size: 0.92rem;
        line-height: 1;
      }

      .music-detail-close:hover {
        background: var(--site-text);
        color: var(--site-panel);
      }

      .music-detail-body {
        display: flex;
        gap: 0.75rem;
        align-items: start;
      }

      .music-detail-cover {
        width: 96px;
        height: 96px;
        flex: 0 0 96px;
        object-fit: cover;
        border: 1px solid var(--site-border);
        margin: 0;
        background: #111111;
      }

      .music-detail-copy {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.84rem;
        line-height: 1.45;
        color: var(--site-muted);
      }

      .music-sprite {
        position: absolute;
        left: 0;
        top: 0;
        width: 90px;
        height: 90px;
        user-select: none;
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 14px 24px rgba(0, 0, 0, 0.32);
        overflow: hidden;
        background: #111111;
        transition:
          transform 120ms ease,
          border-color 120ms ease;
        will-change: transform;
      }

      .music-sprite:hover {
        border-color: rgba(255, 255, 255, 0.95);
        transform: scale(1.06);
        z-index: 5;
      }

      .music-sprite img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      .music-shelf {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1.25rem;
        border-top: 1px solid rgba(0, 0, 0, 0.14);
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.14),
            transparent 22%
          ),
          radial-gradient(
            circle at top right,
            rgba(0, 0, 0, 0.08),
            transparent 18%
          ),
          color-mix(in srgb, var(--site-panel-soft) 88%, #b8bcc7);
      }

      .music-lineup-row {
        display: grid;
        grid-template-columns: 80px 150px minmax(0, 1fr);
        gap: 1rem;
        align-items: start;
      }

      .music-lineup-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
      }

      .music-vibe-name {
        display: inline-block;
        padding: 0.18rem 0.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        background: #2bd9b4;
        color: #111111;
        text-transform: uppercase;
      }

      .music-vibe-name.is-late-night {
        background: #ff6d6d;
        color: #ffffff;
      }

      .music-vibe-headliners {
        margin: 0;
        font-size: 1.28rem;
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .music-lineup-headliners {
        display: flex;
        flex-direction: column;
        gap: 0.18rem;
        align-items: flex-start;
      }

      .music-vibe-row {
        margin: 0;
        font-size: 0.88rem;
        font-weight: 700;
        line-height: 1.35;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: rgba(0, 0, 0, 0.92);
      }

      @media (max-width: 900px) {
        .music-stage {
          min-height: 240px;
        }

        .music-hud {
          top: 0.65rem;
          left: 0.65rem;
        }

        .music-hover {
          left: 0.65rem;
          bottom: 0.65rem;
          min-width: 0;
        }

        .music-detail {
          right: 0.65rem;
          bottom: 0.65rem;
        }

        .music-sprite {
          width: 72px;
          height: 72px;
        }

        .music-shelf {
          padding: 0.9rem;
        }

        .music-lineup-row {
          grid-template-columns: 1fr;
          gap: 0.55rem;
        }

        .music-lineup-label {
          align-items: flex-start;
        }

        .music-lineup-headliners {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
      }

      @media (max-width: 640px) {
        .music-stage {
          min-height: 260px;
        }

        .music-hud {
          top: 0.4rem;
          left: 0.4rem;
          padding: 0.35rem 0.45rem;
          font-size: 0.6rem;
          line-height: 1.25;
          max-width: calc(100% - 0.8rem);
        }

        .music-hud .music-hud-tip {
          display: none;
        }

        .music-speed {
          margin-top: 0.3rem;
          display: flex;
          align-items: center;
          gap: 0.4rem;
        }

        .music-speed label {
          white-space: nowrap;
        }

        .music-speed input {
          width: 80px;
        }

        .music-hover {
          display: none;
        }

        .music-detail {
          right: 0.4rem;
          bottom: 0.4rem;
          left: 0.4rem;
          width: auto;
          padding: 0.55rem 0.6rem;
          gap: 0.5rem;
        }

        .music-detail-title {
          font-size: 0.88rem;
        }

        .music-detail-label {
          font-size: 0.62rem;
        }

        .music-detail-body {
          gap: 0.55rem;
        }

        .music-detail-cover {
          width: 56px;
          height: 56px;
          flex-basis: 56px;
        }

        .music-detail-copy {
          font-size: 0.74rem;
          line-height: 1.35;
        }

        .music-detail-close {
          width: 1.5rem;
          height: 1.5rem;
          font-size: 0.78rem;
        }

        .music-shelf {
          padding: 0.8rem;
        }

        .music-vibe-headliners {
          font-size: 1.05rem;
        }

        .music-vibe-row {
          font-size: 0.78rem;
          line-height: 1.45;
        }
      }

      @media (hover: none), (pointer: coarse) {
        .music-hover {
          display: none;
        }
      }
    </style>

        function clampSprite(sprite, width, height) {
          sprite.x = Math.max(0, Math.min(sprite.x, width - sprite.size));
          sprite.y = Math.max(0, Math.min(sprite.y, height - sprite.size));
        }

        function createSprites() {
          stage
            .querySelectorAll(".music-sprite")
            .forEach((node) => node.remove());
          sprites.length = 0;

          const width = stage.clientWidth;
          const height = stage.clientHeight;
          const phone = width < 640;
          const compact = width < 900;
          const size = phone ? 44 : compact ? 64 : 78;
          const gap = phone ? 6 : compact ? 12 : 16;
          const margin = phone ? 6 : 16;
          const usableWidth = Math.max(width - margin * 2, size);
          const usableHeight = Math.max(height - margin * 2, size);
          const columns = Math.max(
            2,
            Math.floor((usableWidth + gap) / (size + gap)),
          );

          albums.forEach((album, index) => {
            const node = document.createElement("button");
            node.type = "button";
            node.className = "music-sprite";
            node.setAttribute("aria-label", `${album.artist} - ${album.title}`);
            node.innerHTML = `<img src="${album.image}" alt="${album.artist} ${album.title} cover" />`;

            const col = index % columns;
            const row = Math.floor(index / columns);
            const rowOffset = row % 2 === 0 ? 0 : Math.floor(size * 0.38);
            let x = margin + col * (size + gap) + rowOffset;
            let y = margin + row * (size + gap);
            x = Math.max(0, Math.min(x, width - size));
            y = Math.max(0, Math.min(y, height - size));
            const angle = (index / albums.length) * Math.PI * 2 + Math.PI / 6;
            const dx = Math.cos(angle) || 1;
            const dy = Math.sin(angle) || 1;
            const sprite = { album, node, x, y, dx, dy, size };

            node.style.width = `${size}px`;
            node.style.height = `${size}px`;
            node.style.transform = `translate(${x}px, ${y}px)`;

            if (canHover) {
              node.addEventListener("mouseenter", (event) => {
                event.stopPropagation();
                updateHover(album);
              });
            }

            node.addEventListener("focus", () => updateHover(album));

            node.addEventListener("click", (event) => {
              event.stopPropagation();
              updateHover(album);
              openAlbumDetail(album);
            });

            stage.appendChild(node);
            sprites.push(sprite);
          });

          sprites.forEach((sprite) => clampSprite(sprite, width, height));
        }

        function step(timestamp) {
          if (lastTime == null) {
            lastTime = timestamp;
          }

          const dt = Math.min((timestamp - lastTime) / 1000, 0.033);
          lastTime = timestamp;

          if (!paused) {
            const width = stage.clientWidth;
            const height = stage.clientHeight;

            sprites.forEach((sprite) => {
              sprite.x += sprite.dx * sharedSpeed * dt;
              sprite.y += sprite.dy * sharedSpeed * dt;

              let hitX = false;
              let hitY = false;

              if (sprite.x <= 0 || sprite.x + sprite.size >= width) {
                sprite.dx *= -1;
                sprite.x = Math.max(0, Math.min(sprite.x, width - sprite.size));
                hitX = true;
              }

              if (sprite.y <= 0 || sprite.y + sprite.size >= height) {
                sprite.dy *= -1;
                sprite.y = Math.max(
                  0,
                  Math.min(sprite.y, height - sprite.size),
                );
                hitY = true;
              }

              if (hitX && hitY) {
                cornerHits += 1;
                cornerCounter.textContent = String(cornerHits);
              }

              sprite.node.style.transform = `translate(${sprite.x}px, ${sprite.y}px)`;
            });
          }

          animationFrame = requestAnimationFrame(step);
        }

        function handleResize() {
          const width = stage.clientWidth;
          const height = stage.clientHeight;
          const size = width < 640 ? 44 : width < 900 ? 64 : 78;

          sprites.forEach((sprite) => {
            sprite.size = size;
            sprite.node.style.width = `${sprite.size}px`;
            sprite.node.style.height = `${sprite.size}px`;
            clampSprite(sprite, width, height);
            sprite.node.style.transform = `translate(${sprite.x}px, ${sprite.y}px)`;
          });
        }

        stage.addEventListener("click", () => {
          setPaused(!paused);
        });

        pauseOverlay.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        pauseButton.addEventListener("click", (event) => {
          event.stopPropagation();
          setPaused(false);
        });

        detail.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        detailClose.addEventListener("click", (event) => {
          event.stopPropagation();
          closeAlbumDetail();
        });

        speedSlider.addEventListener("input", () => {
          sharedSpeed = Number(speedSlider.value) * 120;
          speedValue.textContent = `${Number(speedSlider.value).toFixed(2)}x`;
        });

        ["pointerdown", "click", "input", "change"].forEach((eventName) => {
          speedSlider.addEventListener(eventName, (event) => {
            event.stopPropagation();
          });
        });

        window.addEventListener("resize", handleResize);

        buildVibeLookup();
        makeShelf();
        updateHover(albums[0]);
        createSprites();
        animationFrame = requestAnimationFrame(step);
      })();
    </script>
    <script>
      (() => {
        const toggle = document.getElementById("theme-toggle");
        const icon = document.getElementById("theme-toggle-icon");
        const root = document.documentElement;

        function syncThemeIcon() {
          if (icon) {
            icon.classList.toggle("is-sun", root.classList.contains("dark"));
          }
        }

        if (toggle) {
          syncThemeIcon();
          toggle.addEventListener("click", () => {
            root.classList.toggle("dark");
            localStorage.setItem(
              "theme",
              root.classList.contains("dark") ? "dark" : "light",
            );
            syncThemeIcon();
          });
        }
      })();
    </script>
